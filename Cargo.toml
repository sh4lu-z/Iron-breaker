[package]
name = "iron_breaker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
futures = "0.3"
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ipnet = "2.9"
md5 = "0.7.0"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.30"
regex = "1.10"
base64 = "0.21"
